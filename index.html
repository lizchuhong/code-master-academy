<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#215b70"><link rel="manifest" href="manifest.webmanifest"><title>Code Master Academy</title><style>body{font:16px system-ui;margin:0;background:#eff7fa;color:#173642}header{text-align:center;background:#ccebf0;padding:24px}main{max-width:850px;margin:auto;padding:16px}.card{padding:20px;background:white;border:1px solid #c9dde3;border-radius:16px;margin:12px 0}button{background:#215b70;color:white;padding:11px 14px;border:0;border-radius:10px;margin:4px;cursor:pointer}nav button{background:white;color:#215b70}textarea{width:95%;min-height:180px;background:#162c38;color:#eefaff;padding:10px;font:14px monospace}iframe{width:100%;height:220px;border:1px solid #ccd8dd;background:white}input{padding:10px}progress{width:100%}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}.list .card{margin:0}small{color:#4c6b76}</style></head><body><header><h1>💻 Code Master Academy</h1><p>Học code 5–15 phút · Thực hành ngay</p><nav><button onclick="home()">Giáo trình</button><button onclick="editor()">Code Lab</button><button onclick="notes()">Ghi chú</button><button onclick="progressView()">Tiến độ</button></nav></header><main id="root"></main><script src="lessons.js"></script><script>
const root=document.getElementById('root'),lessons=window.LESSONS;let done=JSON.parse(localStorage.getItem('code-done')||'{}'),current=0;function home(){root.innerHTML='<h2>Giáo trình '+lessons.length+' bài</h2><p>Học lý thuyết, sửa ví dụ, chạy code, làm câu hỏi.</p><p>Đã hoàn thành '+Object.keys(done).length+'/'+lessons.length+'</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p><input placeholder="Tìm bài học" oninput="filter(this.value)"></p><div id="catalog">'+[...new Set(lessons.map(l=>l.module))].map(m=>'<h3>'+m+'</h3><div class="list">'+lessons.map((l,i)=>l.module===m?'<div class="card" data-title="'+(l.title+' '+m).toLowerCase()+'"><small>'+m+'</small><h3>'+l.title+'</h3><p>'+(done[i]?'✅ Đã học':'Chưa học')+'</p><button onclick="lesson('+i+')">Học ngay</button></div>':'').join('')+'</div>').join('')+'</div>'}function filter(s){document.querySelectorAll('[data-title]').forEach(e=>e.style.display=e.dataset.title.includes(s.toLowerCase())?'':'none')}function lesson(i){current=i;let l=lessons[i];root.innerHTML='<div class="card"><small>'+l.module+'</small><h2>'+l.title+'</h2><p>'+l.task+'</p><textarea id="code" spellcheck="false"></textarea><p><button onclick="run()">▶ Chạy code</button></p><iframe id="preview" title="Kết quả" sandbox="allow-scripts"></iframe><h3>'+l.q+'</h3>'+l.a.map((a,j)=>'<p><button class="answer" data-i="'+j+'"></button></p>').join('')+'<p id="feedback" aria-live="polite"></p><button onclick="home()">Quay lại</button></div>';document.getElementById('code').value=l.ex;document.querySelectorAll('.answer').forEach((e,j)=>{e.textContent=l.a[j];e.onclick=()=>answer(j)});run()}function run(){document.getElementById('preview').srcdoc=document.getElementById('code').value}function answer(i){let ok=i===0;document.getElementById('feedback').textContent=ok?'Đúng! Đã ghi nhận bài học.':'Chưa đúng, hãy thử lại.';if(ok){done[current]=true;localStorage.setItem('code-done',JSON.stringify(done))}}function editor(){root.innerHTML='<div class="card"><h2>Code Lab</h2><p>Viết HTML/CSS/JavaScript và xem kết quả trong khung giới hạn quyền.</p><textarea id="code" spellcheck="false"></textarea><p><button onclick="run()">▶ Chạy code</button></p><iframe id="preview" sandbox="allow-scripts" title="Kết quả"></iframe></div>';document.getElementById('code').value=localStorage.getItem('code-editor')||'<h1>Hello world</h1>';document.getElementById('code').addEventListener('input',e=>localStorage.setItem('code-editor',e.target.value));run()}function notes(){root.innerHTML='<div class="card"><h2>Sổ tay</h2><textarea id="note"></textarea><p><button onclick="localStorage.setItem(\'code-notes\',document.getElementById(\'note\').value);alert(\'Đã lưu\')">Lưu ghi chú</button></p></div>';document.getElementById('note').value=localStorage.getItem('code-notes')||''}function progressView(){root.innerHTML='<div class="card"><h2>Tiến độ</h2><p>'+Object.keys(done).length+'/'+lessons.length+' bài đã hoàn thành</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p>Lưu trên thiết bị này; chưa đồng bộ tài khoản.</p></div>'}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
