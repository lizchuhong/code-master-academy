const D=window.CURRICULUM,root=document.getElementById('root'),weeks=D.weeks,all=weeks.flatMap(w=>w.days.map(d=>({...d,week:w.number,weekTitle:w.title})));const KEY='code-master-40weeks-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{state={}}state.done||={};state.notes||={};state.levels||={};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=0,section=0;function renderBlocks(bs){return bs.map((b,i)=>{if(b.type==='table')return '<div class="tablewrap"><table>'+b.rows.map((r,i)=>'<tr>'+r.map(v=>'<'+(i?'td':'th')+'>'+esc(v)+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</table></div>';let t=esc(b.text);if(b.type==='Code Block')return '<pre><code>'+t+'</code></pre>';if(b.type==='Callout')return '<div class="callout">'+t+'</div>';if(b.type.startsWith('Heading'))return '<h3>'+t+'</h3>';return '<div data-block-index="'+i+'" class="'+(b.type==='List Bullet'?'bullet':b.type==='List Number'?'number':'block')+'">'+t+'</div>'}).join('')}function home(){root.innerHTML='<h2>Lộ trình 50 tuần — 250 bài học</h2><p>Tuần 1–6: QA/Automation/SDET. Tuần 7–46: 200 bài lập trình gốc giữ nguyên thứ tự. Tuần 47–50: FDE. Bài tập AI Stock và AI Tourism xuyên suốt.</p><div class="grid">'+weeks.map(w=>'<div class="card"><div class="eyebrow">Week '+w.number+'</div><h3>'+esc(w.title)+'</h3><p>'+w.days.filter(d=>state.done[d.id]).length+'/5 bài hoàn thành</p><progress value="'+w.days.filter(d=>state.done[d.id]).length+'" max="5"></progress><p><button onclick="weekView('+w.number+')">Xem tuần học</button></p></div>').join('')+'</div>'}function weekView(n){let w=weeks[n-1];root.innerHTML='<button class="secondary" onclick="home()">← 50 tuần</button><h2>Week '+n+': '+esc(w.title)+'</h2><div class="card">'+renderBlocks(w.intro)+'</div>'+w.days.map(d=>'<div class="card"><div class="eyebrow">'+d.id+'</div><h3>'+esc(d.title)+'</h3><p>'+(state.done[d.id]?'✓ Đã hoàn thành':'Chưa hoàn thành')+'</p><button onclick="openDay(\''+d.id+'\')">Học bài này</button></div>').join('')}function openDay(id,sec=0){current=all.findIndex(d=>d.id===id);section=sec;renderDay()}function renderDay(){let d=all[current],s=d.sections[section];root.innerHTML='<div class="row"><button class="secondary" onclick="weekView('+d.week+')">← Tuần '+d.week+'</button><button class="secondary" onclick="openDay(\''+all[Math.max(0,current-1)].id+'\')">Bài trước</button><button class="secondary" onclick="openDay(\''+all[Math.min(all.length-1,current+1)].id+'\')">Bài sau</button></div><div class="card"><div class="eyebrow">Week '+d.week+' · '+d.id+'</div><h2>'+esc(d.title)+'</h2><div class="navdays">'+d.sections.map((v,i)=>'<button class="secondary '+(i===section?'active':'')+'" onclick="section='+i+';renderDay()">'+(i+1)+'. '+esc(v.title)+'</button>').join('')+'</div><h3>'+esc(s.title)+'</h3>'+renderBlocks(s.blocks)+'</div><div class="card"><h3>Thực hành và ghi chú</h3><p class="muted">Bài code Python/FastAPI/SQL cần chạy trong Codespaces hoặc môi trường phù hợp. Khung dưới đây chỉ xem trước HTML/CSS/JS tĩnh, không chạy Python hay backend.</p><label>Code hoặc lời giải của bạn</label><textarea id="work" spellcheck="false" style="font-family:monospace" placeholder="Tự gõ code hoặc giải thích cách làm..."></textarea><div class="row"><button onclick="saveWork()">Lưu bài làm</button><button class="secondary" onclick="previewCode()">Xem thử HTML/CSS/JS</button></div><iframe title="HTML preview" sandbox="allow-scripts" id="preview"></iframe><p id="saved" aria-live="polite"></p></div><div class="card"><label for="level">Mức độ thành thạo (không tự chấm)</label><select id="level" onchange="setLevel(this.value)"><option value="">Chưa đánh giá</option>'+['Learned','Practiced','Built','Tested','Debugged','Explained'].map(x=>'<option '+(state.levels[d.id]===x?'selected':'')+'>'+x+'</option>').join('')+'</select><p><label><input type="checkbox" id="done" style="width:auto" '+(state.done[d.id]?'checked':'')+' onchange="markDone(this.checked)"> Tôi đã thực hành, kiểm thử và giải thích lại được bài</label></p><div class="row"><button class="secondary" onclick="section=Math.max(0,section-1);renderDay()">← Phần trước</button><button class="secondary" onclick="section=Math.min('+ (d.sections.length-1)+',section+1);renderDay()">Phần tiếp →</button></div></div>';document.getElementById('work').value=state.notes[d.id+'-'+section]||''}function saveWork(){state.notes[all[current].id+'-'+section]=document.getElementById('work').value;save();document.getElementById('saved').textContent='Đã lưu trên thiết bị này.'}function previewCode(){let v=document.getElementById('work').value;if(!v.trim())return;document.getElementById('preview').srcdoc=v}function setLevel(v){state.levels[all[current].id]=v;save()}function markDone(v){state.done[all[current].id]=v;save()}function overview(){root.innerHTML='<h2>Coursebook · mục tiêu & nguyên tắc</h2><div class="card">'+renderBlocks(D.overview)+'</div><h2>Checklists & Templates</h2><div class="card">'+renderBlocks(D.appendix)+'</div>'}function notes(){root.innerHTML='<h2>Sổ tay</h2><div class="card"><textarea id="general"></textarea><p><button onclick="state.notes.general=document.getElementById(\'general\').value;save();alert(\'Đã lưu\')">Lưu</button></p></div>';document.getElementById('general').value=state.notes.general||''}function progressView(){let n=all.filter(d=>state.done[d.id]).length;root.innerHTML='<h2>Tiến độ học tập</h2><div class="card"><h2>'+n+' / '+all.length+' bài</h2><progress value="'+n+'" max="'+all.length+'"></progress><p class="muted">Lưu trên thiết bị này, chưa đồng bộ đa thiết bị.</p><button onclick="exportData()">Sao lưu JSON</button><label>Khôi phục bản sao lưu</label><input type="file" accept="application/json" onchange="importData(this)"></div>'}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='code-master-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(el){try{let x=JSON.parse(await el.files[0].text());if(!x||typeof x!=='object'||!x.done||!x.notes)throw Error('Sai định dạng');if(!confirm('Thay dữ liệu hiện tại?'))return;state=x;state.levels||={};save();progressView()}catch(e){alert('Không khôi phục được: '+e.message)}}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js', {updateViaCache:'none'}).catch(()=>{});
