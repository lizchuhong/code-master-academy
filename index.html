<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#215b70"><link rel="manifest" href="manifest.webmanifest"><title>Code Master Academy</title><style>body{margin:0;font:16px system-ui;background:#eff7f9;color:#173542}header{padding:24px;background:#cbeaf0;text-align:center}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border:1px solid #c8dce3;border-radius:16px;padding:18px;margin:14px 0}button{background:#215b70;color:white;border:0;border-radius:10px;padding:12px;margin:5px;cursor:pointer}textarea{width:96%;height:200px;background:#142733;color:#eaf8ff;font:14px monospace;padding:10px}iframe{width:100%;height:220px;border:1px solid #ccc}nav button{background:white;color:#215b70}small{color:#516a73}</style><header><h1>💻 Code Master Academy</h1><p>Học lập trình trong 5–15 phút mỗi ngày</p><nav><button onclick="home()">Bài học</button><button onclick="editor()">Code Lab</button><button onclick="notes()">Ghi chú</button><button onclick="progress()">Tiến độ</button></nav></header><main id="root"></main><script>
const lessons=[{title:"HTML là gì?",topic:"HTML",ex:"<h1>Xin chào!</h1>",q:"Thẻ nào tạo tiêu đề lớn?",opts:["<h1>","<p>","<img>"],a:0},{title:"Đoạn văn và liên kết",topic:"HTML",ex:"<p>Tôi đang học code.</p><a href='https://example.com'>Liên kết</a>",q:"Thẻ nào tạo đoạn văn?",opts:["<div>","<p>","<button>"],a:1},{title:"CSS thay đổi màu",topic:"CSS",ex:"<style>h1{color:teal}</style><h1>Xin chào CSS</h1>",q:"Thuộc tính nào đổi màu chữ?",opts:["padding","color","display"],a:1},{title:"CSS căn lề",topic:"CSS",ex:"<style>p{text-align:center}</style><p>Chính giữa</p>",q:"text-align:center có tác dụng gì?",opts:["Căn giữa chữ","Tăng cỡ chữ","Đổi font"],a:0},{title:"JavaScript biến",topic:"JavaScript",ex:"<p id='out'></p><script>let name='Hà Nội';document.getElementById('out').textContent=name;<\/script>",q:"Từ khóa nào khai báo biến?",opts:["let","href","style"],a:0},{title:"Sự kiện nút bấm",topic:"JavaScript",ex:"<button onclick=\"alert('Xin chào!')\">Bấm thử</button>",q:"Sự kiện nào chạy khi bấm nút?",opts:["onload","onclick","onblur"],a:1},{title:"Dự án website mini",topic:"Dự án",ex:"<style>body{font-family:Arial;background:#f6e8c8;padding:20px}h1{color:#76551c}</style><h1>Tour Hà Nội</h1><p>Khám phá thành phố!</p><button>Đặt tour</button>",q:"Thẻ nào tạo nút?",opts:["<button>","<title>","<head>"],a:0}];let done=JSON.parse(localStorage.getItem('code-done')||'{}');let current=0;const root=document.getElementById('root');function home(){root.innerHTML='<h2>Chương trình lập trình thực hành</h2>'+lessons.map((l,i)=>'<div class="card"><small>'+l.topic+'</small><h3>'+l.title+'</h3><p>'+(done[i]?'✅ Hoàn thành':'Chưa hoàn thành')+'</p><button onclick="lesson('+i+')">Học ngay</button></div>').join('')}function lesson(i){current=i;let l=lessons[i];root.innerHTML='<div class="card"><small>'+l.topic+'</small><h2>'+l.title+'</h2><p>Đọc ví dụ, sửa code rồi chạy thử. Sau đó trả lời câu hỏi.</p><textarea id="code"></textarea><p><button onclick="run()">▶ Chạy code</button></p><iframe id="preview" title="Xem trước" sandbox="allow-scripts"></iframe><h3>'+l.q+'</h3>'+l.opts.map((x,j)=>'<p><button onclick="answer('+j+')">'+x.replaceAll('<','&lt;')+'</button></p>').join('')+'<p id="feedback"></p></div>';document.getElementById('code').value=l.ex;run()}function run(){let code=document.getElementById('code').value;document.getElementById('preview').srcdoc=code}function answer(i){let ok=i===lessons[current].a;document.getElementById('feedback').textContent=ok?'Đúng rồi! Đã lưu bài hoàn thành.':'Chưa đúng. Hãy thử lại.';if(ok){done[current]=true;localStorage.setItem('code-done',JSON.stringify(done))}}function editor(){root.innerHTML='<div class="card"><h2>Code Lab</h2><p>Viết HTML, CSS và JavaScript; xem kết quả ngay bên dưới.</p><textarea id="code"></textarea><button onclick="run()">▶ Chạy code</button><iframe id="preview" sandbox="allow-scripts" title="Kết quả"></iframe></div>';document.getElementById('code').value=localStorage.getItem('code-editor')||'<h1>Hello world!</h1>';document.getElementById('code').addEventListener('input',e=>localStorage.setItem('code-editor',e.target.value));run()}function notes(){root.innerHTML='<div class="card"><h2>Sổ tay lập trình</h2><textarea id="note"></textarea><button onclick="localStorage.setItem(\'code-notes\',document.getElementById(\'note\').value);alert(\'Đã lưu\')">Lưu ghi chú</button></div>';document.getElementById('note').value=localStorage.getItem('code-notes')||''}function progress(){root.innerHTML='<div class="card"><h2>Tiến độ</h2><p>'+Object.keys(done).length+'/'+lessons.length+' bài đã hoàn thành</p><progress value="'+Object.keys(done).length+'" max="'+lessons.length+'"></progress><p>Tiến độ chỉ lưu trên thiết bị hiện tại.</p></div>'}home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
